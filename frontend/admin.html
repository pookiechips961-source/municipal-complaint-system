<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div class="topbar">
  <div>
    <h1>Admin Dashboard</h1>
  </div>
  <button onclick="fetchComplaints()">Refresh</button>
</div>

<div class="stats">
  <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
  <div class="stat"><b id="sPending">0</b><span>Pending</span></div>
  <div class="stat"><b id="sProgress">0</b><span>In Progress</span></div>
  <div class="stat"><b id="sResolved">0</b><span>Resolved</span></div>
</div>

<div class="layout">
  <div id="map"></div>
  <div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search complaints...">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <select id="categoryFilter"><option value="">All categories</option></select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Image</th><th>Complaint</th><th>Description</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="complaintTableBody">
          <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="lightbox" onclick="this.classList.remove('open')"><img alt="Evidence"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/admin.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
