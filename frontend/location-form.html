<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a civic issue</title>
</head>
<body>

<h1>Report a civic issue</h1>

<form id="complaintForm">

  <p>
    <label for="title">Title</label><br>
    <input type="text" id="title" name="title" maxlength="100" required>
  </p>

  <p>
    <label for="category">Category</label><br>
    <select id="category" name="category" required>
      <option value="">Choose a category</option>
      <option>Pothole / Road damage</option>
      <option>Garbage / Sanitation</option>
      <option>Streetlight</option>
      <option>Water supply / Leakage</option>
      <option>Drainage / Sewage</option>
      <option>Illegal encroachment</option>
      <option>Other</option>
    </select>
  </p>

  <p>
    <label for="desc">Description</label><br>
    <textarea id="desc" name="desc" rows="5" cols="40" maxlength="500" required></textarea>
  </p>

  <p>
    <label for="latitude">Latitude</label><br>
    <input type="number" id="latitude" name="latitude" step="any" min="-90" max="90" required>
  </p>

  <p>
    <label for="longitude">Longitude</label><br>
    <input type="number" id="longitude" name="longitude" step="any" min="-180" max="180" required>
  </p>

  <p>
    <button type="button" id="locate">Use my current location</button>
  </p>

  <p>
    <label for="image">Image</label><br>
    <input type="file" id="image" name="image" accept="image/*" required>
  </p>

  <p>
    <img id="preview" alt="Image preview" width="200" hidden>
  </p>

  <p>
    <button type="submit" id="submitBtn">Submit</button>
    <button type="reset" id="resetBtn">Clear</button>
  </p>

  <p id="status"></p>

</form>

<script>
  var API_URL = 'http://localhost:8080/api/complaints';
  var MAX_IMAGE_MB = 5;

  var form = document.getElementById('complaintForm');
  var submitBtn = document.getElementById('submitBtn');
  var statusEl = document.getElementById('status');
  var imageInput = document.getElementById('image');
  var preview = document.getElementById('preview');

  function setStatus(text) {
    statusEl.textContent = text;
  }

  imageInput.addEventListener('change', function () {
    var file = imageInput.files[0];
    if (!file) {
      preview.hidden = true;
      return;
    }
    if (file.size > MAX_IMAGE_MB * 1024 * 1024) {
      setStatus('Image is larger than ' + MAX_IMAGE_MB + ' MB. Choose a smaller file.');
      imageInput.value = '';
      preview.hidden = true;
      return;
    }
    setStatus('');
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
  });

  document.getElementById('locate').addEventListener('click', function () {
    if (!navigator.geolocation) {
      setStatus('This browser does not support location.');
      return;
    }
    setStatus('Finding your location...');
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        document.getElementById('latitude').value = pos.coords.latitude.toFixed(6);
        document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
        setStatus('Coordinates filled in.');
      },
      function () {
        setStatus('Could not get your location. Allow location access or type the coordinates.');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    preview.hidden = true;
    setStatus('');
  });

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve(reader.result);
      };
      reader.onerror = function () {
        reject(new Error('Could not read the image file.'));
      };
      reader.readAsDataURL(file);
    });
  }

  submitBtn.addEventListener('click', async function (event) {
    event.preventDefault();

    if (!form.reportValidity()) {
      return;
    }

    var file = imageInput.files[0];
    submitBtn.disabled = true;
    setStatus('Submitting...');

    try {
      var imageData = await fileToDataUrl(file);

      var payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        description: document.getElementById('desc').value,
        latitude: parseFloat(document.getElementById('latitude').value),
        longitude: parseFloat(document.getElementById('longitude').value),
        imageData: imageData
      };

      var response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error('Server responded with status ' + response.status + '.');
      }

      setStatus('Complaint submitted.');
      form.reset();
      preview.hidden = true;
    } catch (err) {
      setStatus('Submit failed: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
